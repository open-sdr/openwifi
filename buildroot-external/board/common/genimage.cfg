image boot.vfat {
	vfat {
		label = "BOOT"
		files = {
			"BOOT.BIN",
			"u-boot.img",
			"uEnv.txt",
			"uImage",
			"devicetree.dtb",
			"system_top.bit.bin"
		}
	}
	size = 64M
}

image sdcard.img {
	hdimage {
		align = 1M
	}

	partition boot {
		partition-type = 0x0c
		bootable = "true"
		image = "boot.vfat"
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
	}
}
